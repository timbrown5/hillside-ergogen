meta:
  engine: 4.1.0
units:
  # use for Choc spaced keys
  #spacing_x: cx
  #spacing_y: cy
  #$default_spread: cx
  #$default_padding: cy
  #$default_height: cy-1
  #$default_width: cx-1
  # use for MX spaced keys
  spacing_x: U
  spacing_y: U
  # Tenting 
  tenting_layout_radius: 38
  tenting_hole_radius: 5

points:
  zones:
    matrix:
      anchor.shift: [50,-100] # Fix KiCad placement
      columns:
        outer:
          key:
            splay: 15
            origin: [0, -spacing_y]
            column_net: C0
            tags: key
          rows:
            bottom:
              row_net: R0
            home:
              row_net: R1
            top:
              row_net: R2
        pinky:
          key:
            tags: key
          rows:
            bottom:
              row_net: R0
            home:
              row_net: R1
            top:
              row_net: R2
        ring:
          key:
            stagger: 13
            spread: spacing_x + 1
            splay: -5
            tags: key
            bound: true
          rows:
            bottom:
              row_net: R0
              binding: [20, 5, spacing_x, 5]
            home:
              row_net: R1
            top:
              row_net: R2
              tags: [key, crest]
        middle:
          key:
            stagger: 6
            spread: spacing_x + 1
            splay: -5
            tags: key
            bound: true
          rows:
            bottom:
              row_net: R0
            home:
              row_net: R1
            top:
              row_net: R2
              bind: [0, 2, 0, 2]
              tags: [key, crest]
        index:
          key:
            stagger: -5
            tags: key
            bound: true
            
          rows:
            bottom:
              row_net: R0
            home:
              row_net: R1
            top:
              row_net: R2
              bind: [0,1,0,0]
        inner:
          key:
            stagger: -2.5
            tags: key
          rows:
            bottom:
              row_net: R0
              bind: [10, spacing_x + 9, 0, 0]
            home:
              row_net: R1
              bind: [10, spacing_x + 9, 10, 0]
            top:
              row_net: R2
              bind: [0, spacing_x + 5, 10, 0]
    thumb:
      anchor:
        ref: matrix_index_bottom
        shift: [-10.5,-spacing_y]
      key:
        spread: spacing_x + 1
        bound: true
      columns:
        palm:
          key:
            splay: 0
            bind: [10, 20, 0, spacing_x*1.5]
            tags: key
          rows:
            only:
              column_net: C1
              row_net: R3
        outer:
          key:
            splay: -15
            shift: [0, -0.5]
            origin: [-spacing_x/2, -7]
            bind: [10, 20, 0, 2]
            tags: key
          rows:
            only:
              column_net: C2
              row_net: R3
        home:
          key:
            splay: -15
            origin: [-spacing_x/2, -7]
            shift: [0, -0.5]
            bind: [10, 5, 0, 0]
            tags: key
          rows:
            only:
              column_net: C3
              row_net: R3
        inner:
          key:
            splay: -15
            origin: [-spacing_x/2, -7]
            shift: [0, -0.5]
            bind: [0,1,0,0]
            bound: true
            tags: key
          rows:
            only:
              column_net: C5
              row_net: R3
    thumb_upper:
      anchor:
        ref: thumb_home_only
      columns:
        home:
          key:
            shift: [0, spacing_y]
            bind: [0, 3, 0, 0]
            bound: true
            tags: key
          rows:
            only:
              column_net: C4
              row_net: R3
    connector:
      anchor:
        ref: thumb_upper_home_only
        shift: [spacing_x -5, -4]
        rotate: -60
      columns:
        trrs:
          key:
            width: 6.5
            height: 12.2
            bind: [2, 10, 4, 8]
            tags: trrs
            padding: 0
            spread: 0
            stagger: 0
outlines:
  bottom:
    - what: rectangle
      where: [key, trrs, crest]
      bound: true
      asym: left
      size: [spacing_x,spacing_y]
      fillet: 5
      corner: 5
  _key_slot_negative:
    - what: rectangle
      where: true
      size: 13.8
  _key_snap:
    - what: outline
      name: _key_slot_negative
      expand: 1.2
    - what: outline
      name: _key_slot_negative
      operation: subtract
  _prototype_plate:
    - what: outline
      name: bottom
    - what: outline
      name: _key_slot_negative
      operation: subtract
  _mounting_plate:
    - what: hull
      points: 
        - matrix_outer_bottom
        - matrix_outer_home
        - matrix_outer_top
        - matrix_pinky_bottom
        - matrix_pinky_home
        - matrix_pinky_top
        - matrix_ring_bottom
        - matrix_ring_home
        - matrix_ring_top
        - matrix_middle_bottom
        - matrix_middle_home
        - matrix_middle_top
        - matrix_index_bottom
        - matrix_index_home
        - matrix_index_top
        - matrix_inner_bottom
        - matrix_inner_home
        - matrix_inner_top
        - thumb_palm_only
        - thumb_outer_only
        - thumb_home_only
        - thumb_inner_only
        - thumb_upper_home_only
        #- connector_trrs
      concavity: 50
      expand: -0.5
    - what: outline
      name: bottom
      operation: intersect
      fillet: 9
    - what: outline
      name: _key_slot_negative
      operation: subtract
pcbs:
  hillside46:
    template: kicad8
    outlines:
      main:
        outline: bottom
    footprints:
      choc_hotswap:
        what: ceoloide/switch_choc_v1_v2
        where: key
        params:
          from: =column_net
          to: GND
          include_corner_marks: true
          include_keycap: true
          keycap_height: spacing_y - 0.5
          keycap_width: spacing_x - 0.5
          reversible: true
          solder: false
          hotswap: true
          choc_v2_support: true
          outer_pad_width_front: 2.0
          outer_pad_width_back: 2.0
      mcu:
        what: ceoloide/mcu_supermini_nrf52840
        where:
          ref: matrix_inner_home
        params:
          reverse_mount: false
          reversible: true
          only_required_jumpers: true
          # NOTE: the 'P' labels are not raw pin numbers.
          # I have tried to keep the assigned pins the same as the original board.
          P0: "data"
          P1: "LED"
          P2: "SDA"
          P3: "SCL"
          P4: " " # This pin is skipped on the original board.
          P5: "r0"
          P6: "r1"
          P7: "r2"
          P8: " " # This pin is skipped on the original board.
          P9: "r3"
          P10: "c5"
          P16: "c4"
          P14: "c3"
          P15: "c2"
          P18: "c1"
          P19: "c0"
          P20: "enc_a"
          P21: "enc_b"
        adjust:
          shift: [spacing_x+2,9]
      oled:
        what: ceoloide/display_ssd1306
        where:
          ref: matrix_inner_home
        params:
          reversible: true
        adjust:
          shift: [spacing_x+2,6]
      trrs:
        what: ceoloide/trrs_pj320a
        where:
          ref: connector_trrs
          shift: [0, 10]
        params:
          SL: GND
          R2: P2
          TP: VCC # Tip and Ring 1 are joined together
          reversible: true
          symmetric: true
      reset:
        what: ceoloide/reset_switch_smd_side
        where:
          ref: connector_trrs
        params:
          reversible: true
        adjust:
          shift: [10,10]
      ergogen_logo:
        what: ceoloide/utility_ergogen_logo
        where: matrix_ring_bottom
        params:
          scale: 2.5
          reversible: true
        adjust:
          shift: [3,-16]
      # Case holes
      caseholeThumbHome:
        what: ceoloide/mounting_hole_plated
        where:
          ref: [thumb_home_only]
          shift: [10, 3]
      caseHolePinkyBottom:
        what: ceoloide/mounting_hole_plated
        where:
          ref: [matrix_pinky_bottom]
          shift: [10, -2]
      caseHolePinkyTop:
        what: ceoloide/mounting_hole_plated
        where:
          ref: [matrix_pinky_top]
          shift: [10, 5]
      caseHoleMCU:
        what: ceoloide/mounting_hole_plated
        where:
          ref: [matrix_inner_top]
          shift: [33, -6]
      # Holes for mounting tenting
      tentingNorth:
        what: ceoloide/mounting_hole_plated
        where:
          ref: [matrix_middle_top]
          shift: [9, 3]
      tentingEast:
        what: ceoloide/mounting_hole_plated
        where:
          ref: [matrix_middle_top]
          shift: [9-(tenting_layout_radius/2), -3-(tenting_layout_radius/2)]
      tentingSouth:
        what: ceoloide/mounting_hole_plated
        where:
          ref: [matrix_middle_top]
          shift: [9, -3-(tenting_layout_radius)]
      tentingWest:
        what: ceoloide/mounting_hole_plated
        where:
          ref: [matrix_middle_top]
          shift: [9+(tenting_layout_radius/2), -3-(tenting_layout_radius/2)]
      # Tooling holes for PCBA
      toolingHoleTopLeft:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [matrix_outer_top]
          shift: [5, -1.5]
      toolingHoleTopRight:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [matrix_inner_top]
          shift: [5, -1.5]
      toolingHoleBottomRight:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [thumb_outer_only]
          shift: [5, -1.5]
cases:
  prototype:
    - what: outline
      name: _prototype_plate
      extrude: 1.6
    - what: outline
      name: _key_snap
      extrude: 1.6 + 5
  mounting_plate:
    - what: outline
      name: _mounting_plate
      extrude: 1.2
